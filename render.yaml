services:
  - type: web
    name: pm-flightlab
    runtime: node
    plan: free
    buildCommand: npm run build && npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/flightlab
      - key: BACKUP_SECRET
        generateValue: true
